[project]
name = "ircheck"
version = "0.2.1"
description = "Retrieval regression checks for search and RAG"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.28.1,<0.29",
    "pydantic>=2.13,<3",
    "pyyaml>=6.0.2,<7",
]

[project.scripts]
ircheck = "ircheck.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ircheck"]

[dependency-groups]
dev = [
    "mypy>=1.19,<3",
    "pytest>=8.4,<10",
    "ruff>=0.16.7,<1",
    "types-pyyaml>=6.0.12",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/ircheck"]
