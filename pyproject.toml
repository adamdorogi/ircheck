[project]
name = "ircheck"
version = "0.0.1"
description = "Retrieval regression checks for search and RAG"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.13,<3",
    "pyyaml==6.0.2",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ircheck"]
